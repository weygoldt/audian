[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "audian"
dynamic = ["version"]
dependencies = [
  "scipy",
  "numpy",
  "numba",
  "pandas",
  "polars>=1.0",
  "matplotlib",
  "platformdirs",
  "PySide6",
  "pyqtgraph",
  "SoundFile",
  "sounddevice",
  "thunderlab>=1.6.0",
  "audioio",
]
# PySide6 6.11 wheels start at 3.9; the old ">=3.8" would resolve to a
# Python that has no binding to install.
requires-python = ">=3.9"
authors = [
  {name = "Jan Benda", email = "jan.benda@uni-tuebingen.de"},
]
maintainers = [
  {name = "Jan Benda", email = "jan.benda@uni-tuebingen.de"},
]
description = "GUI for viewing and analyzing recordings of animal vocalizations."
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository    = "https://github.com/bendalab/audian"

[project.scripts]
audian-compress = "audian.compresseddata:run"

[project.gui-scripts]
audian = "audian.audian:run"

[tool.setuptools.packages.find]
# Explicit because there are two top-level packages under src/ now: `audian`
# and the plugins that ship with it.  Auto-discovery would probably find
# both, and "probably" is how a release goes out with the Plugins menu empty
# -- which is indistinguishable, from the outside, from a broken feature.
where = ["src"]

# Plugins that live in their own distribution announce themselves in the
# `audian.plugins` entry point group, naming a module whose `audian_*`
# callables audian binds:
#
#     [project.entry-points."audian.plugins"]
#     eventdetection = "audian_plugins.eventdetection"
#
# Nothing is declared here, because everything under `src/audian_plugins`
# is found by walking that package -- the entry point is what a plugin
# gains when it leaves this tree, not something it needs while inside it.

[tool.setuptools.dynamic]
version = {attr = "audian.version.__version__"}

[tool.pytest.ini_options]
pythonpath = "src"

[tool.ruff.format]
# The overhaul left the tree split between single quotes (the older
# modules) and ruff's default double quotes (theme.py and everything
# written against it).  Double wins because it is the default: a
# contributor who runs `ruff format` with no arguments gets the same
# result as CI does.
quote-style = "double"

[tool.uv.sources]
audioio = { git = "https://github.com/weygoldt/audioio" }
