[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "audian"
dynamic = ["version"]
dependencies = [
  "scipy",
  "numpy",
  "numba",
  "pandas",
  "polars>=1.0",
  "matplotlib",
  "platformdirs",
  "PySide6",
  "pyqtgraph",
  "SoundFile",
  "sounddevice",
  "thunderlab>=1.6.0",
  "audioio",
  # The EOD sorter plugin runs wavetracker in a subprocess of this very
  # interpreter, so the two live in one environment and nothing has to be
  # discovered.  Never its `gui` extra: that is PyQt5.
  "wavetracker",
]
# What wavetracker, installed alongside, supports: 3.11 through 3.14.
requires-python = ">=3.11,<3.15"
authors = [
  {name = "Jan Benda", email = "jan.benda@uni-tuebingen.de"},
]
maintainers = [
  {name = "Jan Benda", email = "jan.benda@uni-tuebingen.de"},
]
description = "GUI for viewing and analyzing recordings of animal vocalizations."
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
# What it takes to run the suite: pytest and the ruff its lint test calls.
# `uv sync` installs this group by default.
dev = ["pytest", "ruff"]

[project.urls]
Repository    = "https://github.com/bendalab/audian"

[project.scripts]
audian-compress = "audian.compresseddata:run"

[project.gui-scripts]
audian = "audian.audian:run"

[tool.setuptools.packages.find]
# Explicit because there are two top-level packages under src/ now: `audian`
# and the plugins that ship with it.  Auto-discovery would probably find
# both, and "probably" is how a release goes out with the Plugins menu empty
# -- which is indistinguishable, from the outside, from a broken feature.
where = ["src"]

[tool.setuptools.package-data]
# The bundled UI font (Inter, SIL OFL 1.1) and its licence.
audian = ["fonts/*.ttf", "fonts/*.txt"]

# Plugins that live in their own distribution announce themselves in the
# `audian.plugins` entry point group, naming a module whose `audian_*`
# callables audian binds:
#
#     [project.entry-points."audian.plugins"]
#     eventdetection = "audian_plugins.eventdetection"
#
# Nothing is declared here, because everything under `src/audian_plugins`
# is found by walking that package -- the entry point is what a plugin
# gains when it leaves this tree, not something it needs while inside it.

[tool.setuptools.dynamic]
version = {attr = "audian.version.__version__"}

[tool.pytest.ini_options]
pythonpath = "src"
# Declared so that `--strict-markers` remains available and so that a typo in a
# marker name is a collection error rather than a test that quietly never runs.
markers = [
  "slow: builds widgets on the QApplication.  Applied by conftest to every test that uses the `app` fixture; deselect with -m 'not slow'.",
  "realdata: needs recordings that are not in this repository.  Deselected by default; run with --realdata.",
]

[tool.ruff]
# The oldest Python of requires-python, named so that syntax 3.11 cannot
# parse (PEP 701 f-strings, `type` statements, PEP 695 generics, PEP 758
# unparenthesised `except A, B:`) is flagged rather than written.
target-version = "py311"

[tool.ruff.lint]
# Pyflakes plus the pycodestyle errors, named rather than left to whatever
# the installed ruff defaults to: that default is not a constant across
# ruff versions, so a bare `ruff check` would return a different verdict on
# every machine.  src/ and tests/ both hold this set.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# The overhaul left the tree split between single quotes (the older
# modules) and ruff's default double quotes (theme.py and everything
# written against it).  Double wins because it is the default: a
# contributor who runs `ruff format` with no arguments gets the same
# result as CI does.
quote-style = "double"

[tool.uv.sources]
audioio = { git = "https://github.com/weygoldt/audioio" }
wavetracker = { git = "https://github.com/weygoldt/wavetracker" }
