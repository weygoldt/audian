name: tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest Python of requires-python
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The shared libraries PySide6's offscreen platform plugin links against,
      # which the runner image does not carry, plus PortAudio for sounddevice,
      # plus the monospace font the theme asks for first (JetBrains Mono;
      # the UI font, Inter, ships with audian): the layout tests measure
      # widths, and the DejaVu fallbacks are wider than the panel is laid
      # out for.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libportaudio2 fonts-jetbrains-mono

      # --locked fails rather than re-resolving, so a pyproject.toml change
      # pushed without its uv.lock is caught here instead of tested against
      # whatever resolved today.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run --locked ruff check src tests scripts
          uv run --locked ruff format --check src tests scripts

      - name: Test
        if: matrix.python-version != '3.14'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked pytest tests -q

      # One leg measures coverage, so the other runs at full speed.
      - name: Test with coverage
        if: matrix.python-version == '3.14'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run --locked pytest tests -q
          --cov=src/audian --cov=src/audian_plugins
          --cov-report=term --cov-report=json

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          retention-days: 7

  # Draws the coverage badge and force-pushes it as the only commit of the
  # orphan `badges` branch, which the README shows.  Pushes to master of this
  # repository only: never pull requests, other branches or forks.
  badge:
    needs: pytest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && github.repository == 'weygoldt/audian'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Publish badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/badges"
          python3 scripts/coverage_badge.py coverage.json "$out/coverage.svg"
          cd "$out"
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
